# compliant-dev-infra test hub: GPU passthrough on compliant-dev-workload0
# (MOC-issues #787), from the fork's test branch. Apply by hand on the hub:
#   KUBECONFIG=$HOME/kubeadmin-compliant-dev-infra oc apply -f workload-gpu-test.yaml
# Not the gpu-clusters placement (massopen.cloud/feature-gpu): that also
# installs RHOAI, serverless, service mesh and Kueue, and starts the GPU
# Operator in container mode, which would claim the GPUs for pods.
# Values on the branch: values/compliant-dev-infra/compliant-dev-workload0/
# {nfd-operator,nvidia-gpu-operator}.yaml (sandbox workloads, vm-passthrough).
# Still by hand for this test, each to become an oac-apps change:
# HyperConverged permittedHostDevices and maxHotplugRatio 1
# (openshift-virtualization chart), and vfio_iommu_type1 at boot (a NodePool
# MachineConfig).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nist-gpu-test
  namespace: openshift-gitops
spec:
  generators:
    - list:
        elements:
          - name: compliant-dev-workload0
            server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/compliant-dev-workload0
            component: nfd-operator
          - name: compliant-dev-workload0
            server: https://cluster-proxy-addon-user.multicluster-engine.svc.cluster.local:9092/compliant-dev-workload0
            component: nvidia-gpu-operator
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: "{{name}}-nist-test-{{component}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/EldritchJS/oac-apps.git
        targetRevision: compliant-dev-infra-test
        path: "charts/{{component}}"
        helm:
          releaseName: "{{component}}"
          ignoreMissingValueFiles: true
          valueFiles:
            - "/values/compliant-dev-infra/{{name}}/{{component}}.yaml"
      destination:
        server: "{{server}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
