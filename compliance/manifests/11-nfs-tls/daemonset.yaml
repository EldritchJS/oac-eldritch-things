# tlshd -- userspace TLS handshake daemon for NFS over TLS.
#
# The kernel on this cluster already speaks RPC-over-TLS (42 xprtsec/xs_tls
# symbols, tls.ko loaded, handshake netlink present). It is missing only the
# userspace listener. Without this daemon, a mount with xprtsec=tls fails with
# "mount.nfs: No such process" -- ESRCH from the kernel's handshake upcall.
#
# privileged + hostNetwork are both REQUIRED: the daemon must live in the
# host's network namespace to service handshakes for the host's own sockets.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tlshd
  namespace: nfs-tls
  labels:
    app: tlshd
spec:
  selector:
    matchLabels:
      app: tlshd
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # Storage data path -- replace one node at a time.
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: tlshd
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: tlshd
      # Nothing can mount a TLS-backed volume until this is Running. That
      # matters on reboot, and remediate.sh stage 2 reboots every node.
      priorityClassName: system-node-critical
      # EVERY node, including control-plane.
      #
      # This was originally scoped to workers, on the reasoning that masters
      # carried the control-plane taint and mounted zero NFS -- which was true
      # when measured on 2026-10-06. It was still the wrong call: that was an
      # observation about where pods happened to be sitting, not a durable
      # property. The Compliance Operator's result-server pods schedule onto
      # masters, and when the compliance PVCs moved to nfs-over-tls those
      # mounts failed with exit status 32 on every master, with no handshake
      # even reaching a tlshd (there wasn't one there to reach).
      #
      # A daemon in the storage data path belongs everywhere storage can be
      # mounted. Do not re-narrow this based on current pod placement.
      tolerations:
        - operator: Exists
      # GHCR packages are private by default. This reuses the same secret the
      # BuildConfig pushes with; a classic PAT with write:packages can also
      # read. Alternative: make the package public and drop this.
      imagePullSecrets:
        - name: ghcr-push
      containers:
        - name: tlshd
          # Pinned by digest, not :latest -- the deployed bits are then
          # identical to what was reviewed, and the tag cannot move underneath
          # a node that reboots. Built by BuildConfig tlshd-4 on 2026-10-06
          # from ktls-utils-0.11-3.el9_6 (rhel-9-for-x86_64-baseos-rpms).
          image: ghcr.io/eldritchjs/tlshd@sha256:ec0458d18da724d12c4083c64866c248d509fa100210cbbb3b9e067649063e13
          securityContext:
            privileged: true
            seccompProfile:
              type: RuntimeDefault
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              shopt -s nullglob
              # Trust anchors are installed into THIS container's store, which
              # is correct: tlshd performs the handshake, so tlshd is what
              # needs to trust the storage server.
              found=0
              for cert in /certs/*.crt; do
                echo "installing trust anchor: $cert"
                trust anchor --store "$cert"
                found=1
              done
              if [ "$found" -eq 0 ]; then
                echo "FATAL: no certificates in /certs -- tlshd would fail every" \
                     "handshake. Check the nfs-certificates ConfigMap." >&2
                exit 1
              fi
              exec tlshd -s
          volumeMounts:
            - name: nfs-certificates
              mountPath: /certs
              readOnly: true
          # NOT pgrep: procps-ng is absent from ubi9/ubi, so `pgrep` probes
          # error with "command error: exit code -1" and the pod never goes
          # Ready even though tlshd is running fine. tlshd is PID 1 (the
          # command execs it), so read /proc/1/comm with coreutils instead.
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", '[ "$(cat /proc/1/comm)" = tlshd ]']
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", '[ "$(cat /proc/1/comm)" = tlshd ]']
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: nfs-certificates
          configMap:
            name: nfs-certificates
