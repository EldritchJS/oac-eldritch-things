# Builds the tlshd image IN-CLUSTER using this cluster's RHEL entitlement,
# so the privileged DaemonSet runs an image we own rather than one pulled
# from an unowned registry.
#
# PREREQUISITE -- copy the entitlement secret into this namespace first.
# Use `oc create`, NOT `oc apply`: apply records the whole object in the
# last-applied-configuration annotation, and entitlement.pem is ~325KB base64,
# which exceeds the 256KB annotation limit. See README.md for the exact
# command (it strips server-side metadata first, which `create` requires).
#
# Validated 2026-10-06 (build tlshd-4): ktls-utils is not in the UBI repos, and
# mounting the entitlement alone does not make it resolvable -- the Dockerfile
# below also removes /etc/rhsm-host and adds an explicit cdn.redhat.com repo
# file using the entitlement as client cert. Both steps are required.
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: tlshd
  namespace: nfs-tls
spec:
  # Pushes to GHCR, not the internal registry: the internal registry is
  # managementState=Removed on this cluster, so an ImageStreamTag output fails
  # with InvalidOutputReference ("Output image could not be resolved").
  #
  # Requires a docker-registry secret holding a GitHub PAT with write:packages:
  #   oc create secret docker-registry ghcr-push -n nfs-tls \
  #     --docker-server=ghcr.io --docker-username=<user> --docker-password=<PAT>
  output:
    to:
      kind: DockerImage
      name: ghcr.io/eldritchjs/tlshd:latest
    pushSecret:
      name: ghcr-push
  source:
    type: Dockerfile
    dockerfile: |
      FROM registry.access.redhat.com/ubi9/ubi:latest

      # UBI ships only the UBI repos, which are a subset of RHEL and do NOT
      # carry ktls-utils. Registering with subscription-manager is one way to
      # get the full repos; here we instead use the entitlement certificates
      # mounted by the BuildConfig, which needs no account, activation key, or
      # network registration -- the cluster is already entitled.
      #
      # /etc/rhsm-host makes subscription-manager defer to the host and ignore
      # the mounted certs, so it has to go.
      RUN rm -rf /etc/rhsm-host

      # Point dnf at the CDN using the mounted entitlement as a client cert.
      RUN printf '%s\n' \
        '[rhel-9-baseos]' \
        'name=RHEL 9 BaseOS' \
        'baseurl=https://cdn.redhat.com/content/dist/rhel9/9/x86_64/baseos/os' \
        'enabled=1' \
        'gpgcheck=1' \
        'gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release' \
        'sslverify=1' \
        'sslcacert=/etc/rhsm/ca/redhat-uep.pem' \
        'sslclientcert=/etc/pki/entitlement/entitlement.pem' \
        'sslclientkey=/etc/pki/entitlement/entitlement-key.pem' \
        '' \
        '[rhel-9-appstream]' \
        'name=RHEL 9 AppStream' \
        'baseurl=https://cdn.redhat.com/content/dist/rhel9/9/x86_64/appstream/os' \
        'enabled=1' \
        'gpgcheck=1' \
        'gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-release' \
        'sslverify=1' \
        'sslcacert=/etc/rhsm/ca/redhat-uep.pem' \
        'sslclientcert=/etc/pki/entitlement/entitlement.pem' \
        'sslclientkey=/etc/pki/entitlement/entitlement-key.pem' \
        > /etc/yum.repos.d/rhel9-entitled.repo

      # Apply current RHEL errata to the base. ubi9:latest lags the RHEL repos:
      # build tlshd-6 (2026-10-09) rebuilt "fresh" and still shipped
      # openssl 3.5.8-1 with a fixable Important CVE, because nothing here
      # upgraded it. A rebuild only patches what the build actually updates.
      RUN dnf upgrade -y --refresh
      RUN dnf install -y ktls-utils \
       || { echo "=== install failed; repos dnf could see: ==="; dnf repolist --all; exit 1; }
      RUN dnf clean all && rm -rf /var/cache/dnf

      # Prove the binary is actually present, so a broken image fails at build
      # time rather than as a CrashLoopBackOff on every node.
      RUN /usr/sbin/tlshd --version || test -x /usr/sbin/tlshd

      # tlshd reads /etc/tlshd.conf. The DaemonSet overrides the command to
      # install trust anchors first, so this is the fallback entrypoint.
      CMD ["/usr/sbin/tlshd", "-s"]
  strategy:
    type: Docker
    dockerStrategy:
      volumes:
        - name: etc-pki-entitlement
          mounts:
            - destinationPath: /etc/pki/entitlement
          source:
            type: Secret
            secret:
              secretName: etc-pki-entitlement
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi
