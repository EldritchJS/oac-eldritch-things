# A namespaced RoleBinding, not a ClusterRoleBinding.
#
# The reference implementation uses a ClusterRoleBinding. A RoleBinding in the
# ServiceAccount's own namespace is sufficient to let it use the privileged
# SCC and is the tighter grant -- worth the difference on a cluster being
# hardened to 800-171 3.1 (Access Control).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tlshd-privileged-scc
  namespace: nfs-tls
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: tlshd
    namespace: nfs-tls
