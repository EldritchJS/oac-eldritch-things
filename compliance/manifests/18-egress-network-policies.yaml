        - {protocol: TCP, port: 5353}
---
# ---- nvidia-gpu-operator -------------------------------------------------
# Observed: gpu-operator, mig-manager, node-status-exporter -> API;
# dcgm-exporter -> nvidia-dcgm:5555. Nothing external, including during the
# post-upgrade driver rebuild (Driver Toolkit image, no package downloads).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: nvidia-gpu-operator
spec:
  podSelector: {}
  policyTypes: [Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-api-dns
  namespace: nvidia-gpu-operator
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: TCP, port: 6443}
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - {protocol: UDP, port: 5353}
        - {protocol: TCP, port: 5353}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-same-namespace
  namespace: nvidia-gpu-operator
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {}
---
