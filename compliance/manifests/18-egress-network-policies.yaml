# Default-deny EGRESS NetworkPolicies -- the egress half of manifests/17-*
# (800-53 SC-7 / SC-7(5); HIPAA 164.308(a)(4)(ii)(B), 312(c), 312(e) as
# evaluated by ACS HIPAA_164). Same six namespaces as 17-*, plus stackrox,
# whose ACS-shipped policies are ingress-only.
#
# HOW THE ALLOW RULES WERE DERIVED (2026-10-08), not guessed:
#   - ACS observed network graph since 2026-10-02: 72 distinct egress flows
#     from these namespaces. The window includes GPU modality switches and
#     the 4.22.16 upgrade (every pod restarted, GPU driver rebuilt).
#   - Live sockets (/proc/net/tcp) in central, scanner-v4-matcher,
#     px-pure-csi-controller and portworx-operator, to resolve what ACS
#     reports only as "INTERNAL_ENTITIES:443" -- it is the kubernetes
#     Service (172.31.0.1:443), i.e. the API server.
#   - FlashBlade management endpoint: classified as 10/8 from px-pure-secret
#     without recording it. px-pure-csi-controller only connects while
#     provisioning, so it never showed in a socket snapshot.
#
# API SERVER = port 6443, not 443. OVN-Kubernetes evaluates egress policy
# after Service DNAT, so pods dialling 172.31.0.1:443 are matched as
# <master>:6443. This is the pattern Red Hat uses in ~70 openshift-*
# namespaces (e.g. openshift-nmstate/allow-operator-egress-api-6443).
# DNS likewise: 53 to anywhere, plus 5353 to the openshift-dns pods.
#
# WHAT STAYS OPEN TO THE INTERNET, and why:
#   - stackrox central + scanner-v4-indexer, 443: vulnerability definitions
#     and image-registry metadata/layers for scanning. Observed endpoints are
#     CDNs (Google, Amazon, Cloudflare), so no stable CIDR exists;
#     NetworkPolicy cannot match hostnames. An EgressFirewall with dnsName
#     rules could narrow it later (one per namespace, cluster-external only).
#   - Nothing else. Notably portworx-operator is NOT allowed out: its
#     outbound HTTPS is the version-manifest fetch from install.portworx.com
#     (which component images to run). Blocked, it keeps the manifest it has.
#     For a Portworx upgrade, either allow it temporarily or use Portworx's
#     air-gapped px-versions ConfigMap.
#
# hostNetwork pods are unaffected by NetworkPolicy: tlshd (nfs-tls), the
# etcd-backup job, px-pure-csi-node. ACS keeps flagging those three; that is
# the documented hostNetwork cause in STANDARDS.md §5, not a gap here. The
# policies in nfs-tls and etcd-backup cover anything added there later.
#
# PROBES are unaffected: kubelet -> pod is ingress, and OVN admits it
# (proven in 17-*). Replies to allowed ingress are stateful, not egress.
#
# APPLY ORDER (lowest risk first), verifying after each:
#   1. etcd-backup, nfs-tls        inert today (hostNetwork only)
#   2. rhacs-operator              proves the 6443 API rule on one pod
#   3. nvidia-gpu-operator         GPUs still advertised, DCGM still scraped
#   4. portworx                    provision + delete a test PVC
#   5. stackrox                    Central/Sensor healthy, a scan completes
# Rollback for any step: oc delete -f on that namespace's documents.
---
# ---- etcd-backup ---------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: etcd-backup
spec:
  podSelector: {}
  policyTypes: [Egress]
---
# ---- nfs-tls -------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: nfs-tls
spec:
  podSelector: {}
  policyTypes: [Egress]
---
# In-cluster builds of the tlshd image (manifests/11-nfs-tls/buildconfig.yaml).
# Added 2026-10-08 after default-deny above hung build tlshd-5: its first
# container sat in SYN_SENT to the API service. Missed when 18-* was applied
# because no build ran in the validation window. Build pods exist only while a
# build runs; they need the API, DNS, and HTTPS to registry.access.redhat.com
# (ubi9 base), cdn.redhat.com (entitled RHEL repos) and ghcr.io (push).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-builds
  namespace: nfs-tls
spec:
  podSelector:
    matchExpressions:
      - {key: openshift.io/build.name, operator: Exists}
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: TCP, port: 6443}
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - {protocol: UDP, port: 5353}
        - {protocol: TCP, port: 5353}
    - ports:
        - {protocol: TCP, port: 443}
---
