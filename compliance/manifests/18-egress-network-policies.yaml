        - {protocol: TCP, port: 5353}
---
# FlashBlade management REST API. The array's address is in 10/8; the
# rule names the range, not the address (public repo).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-csi-controller-to-array
  namespace: portworx
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: controller-plugin
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
      ports:
        - {protocol: TCP, port: 443}
---
# ---- stackrox -------------------------------------------------------------
# Adds to the operator-managed ingress policies; does not modify them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: stackrox
spec:
  podSelector: {}
  policyTypes: [Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-api-dns
  namespace: stackrox
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: TCP, port: 6443}
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - {protocol: UDP, port: 5353}
        - {protocol: TCP, port: 5353}
---
# sensor/admission-control/collector/config-controller -> central:8443,
# central -> scanners and central-db, scanners -> their DBs. The existing
# ingress policies still decide which of these each target accepts.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-same-namespace
  namespace: stackrox
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-https-feeds
  namespace: stackrox
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [central, scanner-v4-indexer]}
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: TCP, port: 443}
