# Storage network (br-storage) — NMState, exported from live cluster state.
#
# WHY THIS FILE EXISTS
# --------------------
# The storage VLAN outage in STORAGE-ISSUE.md had two halves. The switch-side
# half (trunking the VLAN to the Pure appliance) is the network team's and is
# NOT reproducible from this repo. The cluster-side half is these five
# NodeNetworkConfigurationPolicies -- and until now they existed only in
# cluster state, in no tracked file. Same gap as manifests/07.
#
# Exported 2026-10-06. Contains no addresses: br-storage takes its IP from
# DHCP, so there is nothing to redact.
#
# APPLYING
# --------
# Verified a no-op against the running cluster at export time. NMState is
# declarative and converges, but a bad NNCP can take a node off the network --
# apply one node at a time and confirm `oc get nncp` reports
# SuccessfullyConfigured before moving on.
#
# auto-gateway: false / auto-dns: false -- APPLIED 2026-10-08
# -----------------------------------------------------------
# Before: DHCP on the storage VLAN installed a SECOND default route on
# br-storage (metric 425; br-ex won only on metric) AND pushed the storage
# gateway into /etc/resolv.conf as a nameserver, with a search domain. So DNS
# could fall back out the storage network. auto-gateway alone would not have
# stopped the DNS half -- both flags are needed.
#
# Safe because the FlashBlade is on the directly-connected storage subnet:
# NFS never used the default route. The connected route comes from the
# interface address, not DHCP, and is unaffected.
#
# How NMState applied it (measured): NetworkManager `device-reapply` -- no
# link down -- with the DHCP client restarted. `ip monitor` on br-storage
# recorded exactly ONE kernel event: deletion of the stray default route. No
# address removal, no subnet-route change. On u16, which carried all six
# TLS NFS mounts: no kernel NFS/RPC messages and zero tlshd re-handshakes, so
# the encrypted connections never dropped. Applied u15 -> 3 masters -> u16.
#
# NOTE: the NIC differs by role -- masters use eno2, workers enp163s0np0.
---
apiVersion: nmstate.io/v1
kind: NodeNetworkConfigurationPolicy
metadata:
  name: br-storage-moc-r4pac08u31-s1a
spec:
  desiredState:
    interfaces:
    - ipv4:
        enabled: false
      ipv6:
        enabled: false
      name: eno2
      state: up
      type: ethernet
    - bridge:
        options:
          stp:
            enabled: false
        port:
        - name: eno2
      ipv4:
        auto-dns: false
        auto-gateway: false
        dhcp: true
        enabled: true
      ipv6:
        enabled: false
      name: br-storage
      state: up
      type: linux-bridge
  nodeSelector:
    kubernetes.io/hostname: moc-r4pac08u31-s1a
---
