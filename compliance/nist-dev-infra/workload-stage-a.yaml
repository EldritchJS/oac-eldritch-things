# nist-dev-infra test hub: compliance components for its hosted clusters,
# stage A. Apply by hand on the hub:
#   KUBECONFIG=$HOME/kubeadmin-nist-dev-infra oc apply -f workload-stage-a.yaml
# Like stage-*.yaml, this points at the fork's test branch, because the
# hub's ArgoCD reads CCI-MOC/oac-apps main, which does not have the
# compliance charts.
#
# Every cluster in the all-managed-clusters placement gets these, as on a
# compliant hub (oac-apps/examples/compliant-hub/apps-compliance.yaml).
# Values on the branch: values/nist-dev-infra/hosted-clusters/<component>.yaml
# for every hosted cluster on the hub (the compliance-operator tailoring is
# there), then values/nist-dev-infra/<cluster>/<component>.yaml.
# Node hardening is not here: hosted clusters get it through their
# NodePools on the hub.
#
# Stage A: the scanner (workers only, platform profiles tailored for hosted
# clusters), AIDE, and the use
# notice. No reboots. Later stages add ACS, NetworkPolicies once the
# cluster's traffic is measured, and tlshd with Portworx.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: nist-compliance-test-managed
  namespace: openshift-gitops
spec:
  generators:
    - matrix:
        generators:
          - clusterDecisionResource:
              configMapRef: acm-placement
              labelSelector:
                matchLabels:
                  cluster.open-cluster-management.io/placement: all-managed-clusters
              requeueAfterSeconds: 180
          - list:
              elements:
                - component: compliance-operator
                - component: file-integrity
                - component: platform-hardening
  template:
    metadata:
      name: "{{name}}-nist-test-{{component}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/EldritchJS/oac-apps.git
        targetRevision: nist-dev-infra-test
        path: "charts/{{component}}"
        helm:
          ignoreMissingValueFiles: true
          valueFiles:
            - "/values/nist-dev-infra/hosted-clusters/{{component}}.yaml"
            - "/values/nist-dev-infra/{{name}}/{{component}}.yaml"
      destination:
        server: "{{server}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 5
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 10m
