# Hub values, one document per file under values/<hub>/local-cluster/.
# Split on the "# file:" lines. Settings jetty proved; the reasons are in
# compliance/manifests/ and the chart values.yaml files.

# file: cluster-certificates.yaml (merge into the existing file)
apiServer:
  audit:
    profile: WriteRequestBodies
    # Platform operators to metadata only, by bytes written (measured on
    # jetty: these ten were ~91% of audit volume). Re-measure on the hub.
    customRules:
      - {group: "system:serviceaccounts:openshift-operator-lifecycle-manager", profile: Default}
      - {group: "system:serviceaccounts:openshift-cnv", profile: Default}
      - {group: "system:serviceaccounts:openshift-network-operator", profile: Default}
      - {group: "system:serviceaccounts:portworx", profile: Default}
      - {group: "system:serviceaccounts:openshift-machine-config-operator", profile: Default}
      - {group: "system:serviceaccounts:openshift-apiserver-operator", profile: Default}
      - {group: "system:serviceaccounts:openshift-monitoring", profile: Default}
      - {group: "system:serviceaccounts:openshift-console-operator", profile: Default}
      - {group: "system:serviceaccounts:openshift-cloud-controller-manager-operator", profile: Default}
      - {group: "system:serviceaccounts:openshift-cluster-olm-operator", profile: Default}
  encryption:
    type: aesgcm
---
# file: compliance-node-hardening.yaml
# Both outputs: the hub's own MachineConfigs, and the ConfigMap the hosted
# clusters' NodePools reference.
nodePool:
  enabled: true
---
# file: compliance-operator.yaml
scanSetting:
  rawResultStorage:
    storageClassName: nfs-over-tls
---
# file: etcd-backup.yaml
image: quay.io/openshift-release-dev/ocp-v4.0-art-dev@sha256:<oc adm release info --image-for=cli>
storage:
  storageClassName: nfs-over-tls
---
# file: rhacs.yaml
central:
  enabled: true
  spec:
    central:
      exposure:
        route:
          enabled: true
      db:
        persistence:
          persistentVolumeClaim:
            claimName: central-db
            size: 100Gi
            storageClassName: nfs-over-tls
    egress:
      connectivityPolicy: Online
securedCluster:
  enabled: true
  clusterName: oac-dev-infra
  centralEndpoint: central.stackrox.svc:443
